<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<!--
  Habla — multi-language speaking trainer (Speak-style)
  Version: v3.1
  Last Modified: 2026-10-29
  Changelog:
    v3.1 — Igbo audio LIVE: routes Igbo TTS through the habla-tts Cloudflare Worker
           (Google blocks direct browser playback; the Worker fetches it server-side). Hear it / Slow
           now speak Igbo. Updated Igbo note.
    v3.0 — multi-language. Added Igbo (từ scratch, beginner) with free audio via Google Translate
           TTS (no key, no cost) + self-check speaking (free Igbo mic scoring isn't viable yet).
           Added Spanish lessons: days, weather, past tense. Added Hard Mode (hides target text on
           speak drills). Language switcher (Spanish ⇄ Igbo); progress tracked separately per language.
           Removed French. Per-language audio routing (browser voice for Spanish, Google TTS for Igbo)
           and per-language mic-scoring support. v2 progress migrates into Spanish.
    v2.3 — standalone full-document build for GitHub Pages hosting (mic + voice run top-level).
    v2.2 — self-check fallback when mic is blocked (sandbox); auto-enable mic scoring top-level.
    v2.1 — FIX restored missing </script> tag.
    v2.0 — review SRS, daily goal + XP, conversations, build-a-sentence, listening quiz.
    v1.0 — initial listen→repeat→score loop.
-->
<title>Habla</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
:root { padding: env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px); color-scheme: light; }
html,body{margin:0;} body{font-family:"DM Sans",system-ui,sans-serif;font-size:14px;} img{max-width:100%;} [hidden]{display:none!important;}
</style>
<style>
  /* Layout: phone app — sticky top bar, scrolling tab panels, fixed bottom nav; full-screen session overlay */
  :root {
    --bg: #fbf7f0; --surface: #ffffff; --surface-2: #f6f0e6;
    --ink: #2b2522; --ink-soft: #857a70; --line: #ece4d8;
    --accent: #e0572b; --accent-ink: #ffffff; --gold: #d99a2b;
    --good: #2f9e56; --warn: #d99a2b; --bad: #cf4040; --blue: #3a76b8;
    --shadow: 0 1px 2px rgba(43,37,34,.06), 0 8px 24px rgba(43,37,34,.07);
    color-scheme: light;
    --f-display: "Fraunces", Georgia, serif;
    --f-body: "DM Sans", system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a1613; --surface: #241f1b; --surface-2: #2d2722;
      --ink: #f1e9df; --ink-soft: #a89a8c; --line: #342c26;
      --accent: #f26a3d; --accent-ink: #1a1613; --gold: #e7b155;
      --good: #4fc37e; --warn: #e7b155; --bad: #e86a6a; --blue: #6aa0d8;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.4);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1a1613; --surface: #241f1b; --surface-2: #2d2722;
    --ink: #f1e9df; --ink-soft: #a89a8c; --line: #342c26;
    --accent: #f26a3d; --accent-ink: #1a1613; --gold: #e7b155;
    --good: #4fc37e; --warn: #e7b155; --bad: #e86a6a; --blue: #6aa0d8;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.4);
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: var(--f-body); -webkit-font-smoothing: antialiased; line-height: 1.5; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); }
  * { box-sizing: border-box; }
  button { font-family: inherit; cursor: pointer; }
  .hidden { display: none !important; }

  .bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 15; background: var(--surface); border-bottom: 1px solid var(--line); padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 9px; }
  .brand { font-family: var(--f-display); font-weight: 600; font-size: 1.4rem; letter-spacing: -.01em; margin-right: auto; }
  .brand .tilde { color: var(--accent); }
  .pill { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; font-size: .9rem; padding: 5px 11px; border-radius: 999px; font-variant-numeric: tabular-nums; }
  .pill.streak { background: color-mix(in srgb, var(--gold) 16%, transparent); color: var(--ink); }
  .pill.xp { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--ink); }
  .pill svg { width: 15px; height: 15px; }
  .iconbtn { min-width: 38px; height: 38px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft); display: grid; place-items: center; padding: 0 9px; font-size: 1.1rem; }
  .iconbtn svg { width: 18px; height: 18px; }

  .wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px; padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); max-width: 560px; margin-inline: auto; }

  .goal-card { display: flex; align-items: center; gap: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; box-shadow: var(--shadow); margin-bottom: 20px; }
  .ring { flex: 0 0 auto; position: relative; width: 66px; height: 66px; }

  .ring .lbl { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-display); font-weight: 600; font-size: .95rem; font-variant-numeric: tabular-nums; }
  .goal-txt { min-width: 0; }
  .goal-txt .t { font-family: var(--f-display); font-weight: 600; font-size: 1.1rem; }
  .goal-txt .d { font-size: .85rem; color: var(--ink-soft); }
  .goal-txt .done { color: var(--good); font-weight: 600; }

  .hero-line { font-family: var(--f-display); font-weight: 500; font-size: 1.05rem; color: var(--ink-soft); text-wrap: balance; margin-bottom: 14px; }
  .hero-line b { color: var(--ink); font-weight: 600; }
  .sec-label { font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-soft); font-weight: 600; margin: 4px 2px 10px; }

  .lessons { display: flex; flex-direction: column; gap: 11px; }

  .lesson.blue .em { background: color-mix(in srgb, var(--blue) 14%, transparent); }

  .lesson .t { font-weight: 600; font-size: 1.02rem; font-family: var(--f-display); }
  .lesson .d { font-size: .82rem; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .done-badge { flex: 0 0 auto; color: var(--good); display: grid; place-items: center; }
  .done-badge svg { width: 20px; height: 20px; }
  .chev { flex: 0 0 auto; color: var(--ink-soft); }
  .chev svg { width: 18px; height: 18px; }

  .big-cta { width: 100%; border: none; border-radius: 18px; padding: 18px; display: flex; align-items: center; gap: 14px; text-align: left; background: var(--accent); color: var(--accent-ink); box-shadow: 0 6px 20px color-mix(in srgb, var(--accent) 35%, transparent); margin-bottom: 10px; }
  .big-cta.flat { background: var(--surface); color: var(--ink); border: 1px solid var(--line); box-shadow: var(--shadow); }
  .big-cta .em { font-size: 1.7rem; flex: 0 0 auto; }
  .big-cta .body { flex: 1; min-width: 0; }
  .big-cta .t { font-family: var(--f-display); font-weight: 600; font-size: 1.15rem; }
  .big-cta .d { font-size: .85rem; opacity: .9; }
  .big-cta:disabled { opacity: .55; box-shadow: none; }

  .mic-note { margin-top: 22px; font-size: .78rem; color: var(--ink-soft); background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 11px 13px; text-wrap: pretty; }

  .you-stats { display: grid; grid-template-columns: repeat(2,1fr); gap: 12px; margin-bottom: 22px; }
  .you-stat { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; text-align: center; }
  .you-stat .n { font-family: var(--f-display); font-weight: 600; font-size: 2rem; line-height: 1; font-variant-numeric: tabular-nums; }
  .you-stat .l { font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-soft); margin-top: 6px; }
  .setting-row { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 11px; }
  .setting-row .t { font-weight: 600; } .setting-row .grow { flex: 1; min-width: 0; }
  .setting-row .d { font-size: .8rem; color: var(--ink-soft); }
  .stepper { display: flex; align-items: center; gap: 10px; }
  .stepper button { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); font-size: 1.2rem; font-weight: 700; display: grid; place-items: center; }
  .stepper .val { min-width: 34px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
  .danger-btn { width: 100%; border: 1px solid color-mix(in srgb, var(--bad) 40%, var(--line)); background: var(--surface); color: var(--bad); border-radius: 14px; padding: 13px; font-weight: 600; margin-top: 8px; }
  /* toggle */
  .toggle { width: 50px; height: 30px; border-radius: 999px; border: none; background: var(--line); position: relative; transition: background .2s; flex: 0 0 auto; }
  .toggle.on { background: var(--accent); }
  .toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 999px; background: #fff; transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
  .toggle.on::after { transform: translateX(20px); }

  /* language sheet */
  .sheet-back { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.4); display: grid; place-items: end center; }
  .sheet { width: 100%; max-width: 560px; background: var(--surface); border-radius: 22px 22px 0 0; padding: 20px max(18px, env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px)); }
  .sheet h3 { font-family: var(--f-display); margin: 0 0 4px; font-size: 1.3rem; }
  .sheet p { margin: 0 0 16px; color: var(--ink-soft); font-size: .85rem; }
  .lang-opt { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: var(--surface-2); border: 1.5px solid transparent; border-radius: 14px; padding: 14px; margin-bottom: 10px; color: var(--ink); }
  .lang-opt.sel { border-color: var(--accent); }
  .lang-opt .flag { font-size: 1.8rem; flex: 0 0 auto; }
  .lang-opt .t { font-family: var(--f-display); font-weight: 600; font-size: 1.1rem; }
  .lang-opt .d { font-size: .78rem; color: var(--ink-soft); }
  .lang-opt .check { margin-left: auto; color: var(--accent); }

  .session { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
  .s-top { display: flex; align-items: center; gap: 12px; padding: 12px max(16px, env(safe-area-inset-left,0px)); }
  .s-prog { flex: 1; height: 7px; border-radius: 999px; background: var(--line); overflow: hidden; }
  .s-prog > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .35s ease; }
  .s-count { font-size: .8rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .ghostbtn { background: none; border: none; color: var(--ink-soft); font-weight: 600; font-size: 1.1rem; padding: 4px 8px; }

  .stage { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 16px; padding: 8px max(20px, env(safe-area-inset-left,0px)); overflow-y: auto; }
  .ex-type { align-self: center; font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; font-weight: 700; color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); padding: 4px 11px; border-radius: 999px; }
  .prompt-en { text-align: center; color: var(--ink-soft); font-size: .95rem; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
  .prompt-es { text-align: center; font-family: var(--f-display); font-weight: 600; font-size: clamp(1.8rem, 8.5vw, 2.8rem); line-height: 1.12; letter-spacing: -.015em; text-wrap: balance; transition: filter .2s; }
  .prompt-es .w { transition: color .2s ease; padding: 0 1px; border-radius: 4px; }
  .prompt-es .w.hit { color: var(--good); }
  .prompt-es .w.miss { color: var(--bad); }
  .prompt-es.veiled { filter: blur(11px); opacity: .55; }
  .reveal-btn { align-self: center; background: none; border: 1px solid var(--line); color: var(--ink-soft); border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: .8rem; }
  .phon { text-align: center; color: var(--ink-soft); font-style: italic; font-size: 1.02rem; }
  .phon b { color: var(--accent); font-style: normal; font-weight: 600; }

  .hear-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .hear { display: inline-flex; align-items: center; gap: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 10px 18px; font-weight: 600; font-size: .92rem; box-shadow: var(--shadow); }
  .hear svg { width: 17px; height: 17px; color: var(--accent); }
  .hear.slow { opacity: .85; font-weight: 500; }
  .hear:disabled { opacity: .5; }

  .feedback { text-align: center; min-height: 24px; font-weight: 600; font-size: 1.05rem; }
  .feedback.good { color: var(--good); } .feedback.mid { color: var(--warn); } .feedback.bad { color: var(--bad); }
  .heard { text-align: center; font-size: .85rem; color: var(--ink-soft); min-height: 18px; }
  .heard b { color: var(--ink); }

  .opts { display: flex; flex-direction: column; gap: 10px; max-width: 420px; width: 100%; margin: 0 auto; }
  .opt { width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 13px; padding: 15px 16px; font-weight: 600; font-size: 1rem; color: var(--ink); transition: transform .1s ease; }
  .opt:active { transform: scale(.98); }
  .opt.correct { border-color: var(--good); background: color-mix(in srgb, var(--good) 12%, var(--surface)); }
  .opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, var(--surface)); }

  .answer-slot { min-height: 58px; border: 1.5px dashed var(--line); border-radius: 13px; padding: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; max-width: 440px; width: 100%; margin: 0 auto; background: var(--surface-2); }
  .answer-slot.ok { border-color: var(--good); border-style: solid; }
  .answer-slot.no { border-color: var(--bad); border-style: solid; }
  .bank { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 440px; width: 100%; margin: 0 auto; }
  .chip { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 11px; padding: 10px 14px; font-weight: 600; font-size: 1.02rem; box-shadow: var(--shadow); }
  .chip.used { opacity: .35; pointer-events: none; }
  .chip.placed { background: var(--accent); color: var(--accent-ink); border-color: transparent; box-shadow: none; }

  .convo { display: flex; flex-direction: column; gap: 12px; max-width: 460px; width: 100%; margin: 0 auto; }
  .bubble { max-width: 82%; padding: 12px 15px; border-radius: 18px; box-shadow: var(--shadow); }
  .bubble .es { font-family: var(--f-display); font-weight: 600; font-size: 1.15rem; }
  .bubble .en { font-size: .82rem; opacity: .8; margin-top: 3px; }
  .bubble .ph { font-size: .78rem; font-style: italic; opacity: .7; margin-top: 2px; }
  .bubble.them { align-self: flex-start; background: var(--surface); border-bottom-left-radius: 5px; }
  .bubble.you { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 5px; }
  .bubble .playmini { background: none; border: none; color: inherit; opacity: .7; padding: 0; margin-top: 4px; font-size: .75rem; font-weight: 600; display: inline-flex; gap: 4px; align-items: center; }
  .bubble .playmini svg { width: 13px; height: 13px; }
  .your-turn { text-align: center; font-size: .8rem; color: var(--ink-soft); font-weight: 600; }

  .s-actions { padding: 14px max(20px, env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)); display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .mic { width: 82px; height: 82px; border-radius: 999px; border: none; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; box-shadow: 0 6px 20px color-mix(in srgb, var(--accent) 45%, transparent); transition: transform .12s ease; }
  .mic:active { transform: scale(.94); }
  .mic svg { width: 34px; height: 34px; }
  .mic.listening { animation: pulse 1.3s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent); } 50% { box-shadow: 0 0 0 16px color-mix(in srgb, var(--accent) 0%, transparent); } }
  @media (prefers-reduced-motion: reduce) { .mic.listening { animation: none; } }
  .mic-label { font-size: .82rem; color: var(--ink-soft); font-weight: 600; text-align:center; }
  .self-rate { display: flex; gap: 10px; width: 100%; max-width: 440px; }
  .self-rate button { flex: 1; border-radius: 13px; padding: 13px 8px; font-weight: 600; font-size: .9rem; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
  .self-rate button.yes { border-color: color-mix(in srgb, var(--good) 40%, var(--line)); }
  .self-rate button.again { border-color: color-mix(in srgb, var(--bad) 35%, var(--line)); }
  .next { width: 100%; max-width: 440px; border: none; background: var(--ink); color: var(--bg); border-radius: 14px; padding: 15px; font-weight: 600; font-size: 1rem; }
  .next.accent { background: var(--accent); color: var(--accent-ink); }
  .next:disabled { opacity: .4; }

  .finish { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 12px; padding: 20px; }
  .finish .big { font-family: var(--f-display); font-size: 3.4rem; line-height: 1; }
  .finish h2 { font-family: var(--f-display); font-weight: 600; font-size: 1.7rem; margin: 0; }
  .finish .score { font-size: 1.05rem; color: var(--ink-soft); }
  .finish .score b { color: var(--accent); }
  .finish .xpgain { display: inline-flex; align-items: center; gap: 6px; background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--ink); font-weight: 700; padding: 8px 16px; border-radius: 999px; font-size: 1.05rem; }

  .nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 16; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--line); display: flex; justify-content: space-around; padding-top: 8px; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); padding-left: max(8px, env(safe-area-inset-left,0px)); padding-right: max(8px, env(safe-area-inset-right,0px)); }
  .nav button { position: relative; background: none; border: none; color: var(--ink-soft); display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: .68rem; font-weight: 600; padding: 4px 14px; border-radius: 10px; }
  .nav button svg { width: 23px; height: 23px; }
  .nav button.on { color: var(--accent); }
  .nav button .badge { position: absolute; transform: translate(14px,-6px); background: var(--accent); color: var(--accent-ink); font-size: .6rem; font-weight: 700; min-width: 16px; height: 16px; border-radius: 999px; display: grid; place-items: center; padding: 0 4px; }
</style>

  <div class="brand">Habla<span class="tilde">~</span></div>
  <button class="iconbtn" id="langBtn" aria-label="Change language"><span id="langFlag">🇪🇸</span></button>
  <div class="pill xp" title="Total XP">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.3 6.9.7-5.1 4.6 1.4 6.8L12 17.8 5.9 20.4l1.4-6.8L2.2 9l6.9-.7z"/></svg>
    <span id="xpNum">0</span>
  </div>
  <div class="pill streak" title="Day streak">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c0 3-4 4-4 8a4 4 0 0 0 8 0c0-1.5-.8-2.6-1.6-3.6C16 9 18 11 18 14a6 6 0 0 1-12 0C6 8 12 7 12 2z"/></svg>
    <span id="streakNum">0</span>

/* =============================================================
   STATE (per-language progress + migration from v2)
   ============================================================= */
const LS_KEY = "habla.v1";
const todayStr = () => new Date().toISOString().slice(0,10);
const SRS_DAYS = [0,1,2,4,8,16];

function freshProg(){ return { stats:{}, totalScored:0, scoreSum:0 }; }

function loadState(){
  let s = { lang:"es", prog:{}, xp:0, streak:0, lastDay:null,
            dailyGoal:10, dailyCount:0, dailyDate:null, hardMode:false };
  try { const raw = localStorage.getItem(LS_KEY); if (raw) s = Object.assign(s, JSON.parse(raw)); } catch(e){}
  s.prog = s.prog || {};
  // migrate v2 (flat stats/mastered = Spanish)
  if (s.stats && !s.prog.es){
    s.prog.es = { stats: s.stats, totalScored: s.totalScored||0, scoreSum: s.scoreSum||0 };
    if (s.mastered){
      Object.keys(s.mastered).forEach(lid=> Object.keys(s.mastered[lid]).forEach(idx=>{
        const k = lid+":"+idx; if (!s.prog.es.stats[k]) s.prog.es.stats[k] = {box:2,miss:0,correct:1,last:todayStr()};
      }));
    }
    delete s.stats; delete s.mastered; delete s.totalScored; delete s.scoreSum;
  }
  if (!LANGS[s.lang]) s.lang = "es";
  return s;
}
function saveState(){ try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){} }
let state = loadState();

function P(){ if (!state.prog[state.lang]) state.prog[state.lang] = freshProg(); return state.prog[state.lang]; }
function L(){ return LANGS[state.lang]; }

/* POOL = flattened items for the CURRENT language */
let POOL = [];
function rebuildPool(){
  POOL = [];
  L().lessons.forEach(les => les.items.forEach((it,i)=> POOL.push({ ...it, lid:les.id, idx:i, key:les.id+":"+i })));
}
const byKey = k => POOL.find(p=>p.key===k);

function rollDaily(){ const t=todayStr(); if (state.dailyDate!==t){ state.dailyDate=t; state.dailyCount=0; saveState(); } }
rollDaily();
function touchStreak(){ const t=todayStr(); if (state.lastDay===t) return; const y=new Date(Date.now()-864e5).toISOString().slice(0,10); state.streak=(state.lastDay===y)?state.streak+1:1; state.lastDay=t; saveState(); }

function record(key, passed, pct){
  const st = P().stats[key] || { box:0, miss:0, correct:0, last:null };
  if (passed){ st.box = Math.min(st.box+1, SRS_DAYS.length-1); st.correct++; }
  else { st.box = 1; st.miss++; }
  st.last = todayStr();
  P().stats[key] = st;
  const gain = passed ? (pct>=85?12:10) : 3;
  state.xp += gain; rollDaily(); if (passed) state.dailyCount++;
  if (typeof pct === "number"){ P().totalScored++; P().scoreSum += pct; }
  saveState();
  return gain;
}
function dueItems(){
  const t = Date.now(); const due=[];
  POOL.forEach(p=>{ const st=P().stats[p.key]; if(!st) return; if(st.box>=SRS_DAYS.length-1) return;
    const last = st.last ? new Date(st.last).getTime() : 0;
    if (st.miss>st.correct || t-last >= SRS_DAYS[st.box]*864e5) due.push(p); });
  due.sort((a,b)=>{ const sa=P().stats[a.key], sb=P().stats[b.key]; return (sa.box-sb.box)||(sb.miss-sa.miss); });
  return due;
}

/* =============================================================
   SPEECH — out (webspeech or Google TTS), in (recognition)
   ============================================================= */
const TTS_PROXY = "https://habla-tts.jesgetme.workers.dev"; // Cloudflare Worker — free Igbo audio
const synth = window.speechSynthesis;
let voices = [];
function pickVoices(){ if (synth) voices = synth.getVoices(); }
if (synth){ pickVoices(); synth.onvoiceschanged = pickVoices; }
function voiceFor(recLang){
  if (!voices.length) pickVoices();
  const base = recLang.split("-")[0];
  return voices.find(v=>v.lang && v.lang.toLowerCase()===recLang.toLowerCase())
      || voices.find(v=>v.lang && v.lang.toLowerCase().startsWith(base)) || null;
}
let curAudio = null;
function stopAudio(){ if (curAudio){ try{curAudio.pause();}catch(e){} curAudio=null; } if (synth) synth.cancel(); }

function speak(text, rate=1){
  const lang = L();
  stopAudio();
  if (lang.tts === "gtts"){
    // Igbo audio via the habla-tts Cloudflare Worker (free). It fetches Google's voice
    // server-side, since Google blocks direct browser playback.
    const slow = rate < 0.85;
    const url = TTS_PROXY + "/?tl=" + encodeURIComponent(lang.gcode) +
                "&slow=" + (slow ? "1" : "0") + "&q=" + encodeURIComponent(text);
    try { curAudio = new Audio(url); if (slow) curAudio.playbackRate = 0.65; curAudio.play().catch(()=>{}); } catch(e){}
    return;
  }
  if (!synth) return;
  const u = new SpeechSynthesisUtterance(text);
  const v = voiceFor(lang.recLang);
  u.lang = v ? v.lang : lang.recLang; if (v) u.voice = v; u.rate = rate;
  synth.speak(u);
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let IN_FRAME = false; try { IN_FRAME = window.self !== window.top; } catch(e){ IN_FRAME = true; }
let micBlocked = false;

const canScore = () => L().recog && !!SR && !IN_FRAME && !micBlocked;

function norm(s){ return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[¿?¡!.,]/g,"").replace(/\s+/g," ").trim(); }
function wordsOf(s){ return norm(s).split(" ").filter(Boolean); }
function near(a,b){ if(Math.abs(a.length-b.length)>2) return false; let d=0,i=0,j=0;
  while(i<a.length&&j<b.length){ if(a[i]===b[j]){i++;j++;} else { d++; if(d>1) return false; if(a.length>b.length)i++; else if(b.length>a.length)j++; else{i++;j++;} } }
  d+=(a.length-i)+(b.length-j); return d<=1; }
function scoreSpeech(target, heard){
  const tw=wordsOf(target), hw=new Set(wordsOf(heard)); let hits=0;
  const perWord = tw.map(w=>{ const ok=hw.has(w)||[...hw].some(h=>near(h,w)); if(ok)hits++; return ok; });
  return { pct: tw.length ? Math.round(hits/tw.length*100):0, perWord };
}

const main = document.getElementById("main");
const el = id => document.getElementById(id);
let currentTab = "learn";

function lessonProgress(les){ let done=0; les.items.forEach((_,i)=>{ const st=P().stats[les.id+":"+i]; if(st&&st.box>=3)done++; }); return { done, total:les.items.length, pct: Math.round(done/les.items.length*100) }; }

function refreshChrome(){
  el("xpNum").textContent = state.xp;
  el("streakNum").textContent = state.streak;
  el("langFlag").textContent = L().flag;
  const d = dueItems().length;
  el("reviewBadge").innerHTML = d ? `<span class="badge">${d}</span>` : "";

function render(){ refreshChrome(); if(currentTab==="learn")renderLearn(); else if(currentTab==="review")renderReview(); else if(currentTab==="talk")renderTalk(); else renderYou(); window.scrollTo(0,0); }

function goalRing(){
  rollDaily();
  const pct=Math.min(state.dailyCount/state.dailyGoal,1); const r=28,c=2*Math.PI*r,off=c*(1-pct);
  const met=state.dailyCount>=state.dailyGoal;
  return `<div class="goal-card"><div class="ring"><svg viewBox="0 0 66 66"><circle class="bg" cx="33" cy="33" r="${r}" fill="none" stroke-width="7"/><circle class="fg" cx="33" cy="33" r="${r}" fill="none" stroke-width="7" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg><div class="lbl">${state.dailyCount}/${state.dailyGoal}</div></div><div class="goal-txt"><div class="t">Daily goal</div><div class="d ${met?'done':''}">${met?'✓ Done for today — nice!':`${state.dailyGoal-state.dailyCount} more phrase${state.dailyGoal-state.dailyCount===1?'':'s'} to go`}</div></div></div>`;
}

/* =============================================================
   SESSION ENGINE
   ============================================================= */
const sess = el("session");
let S = null;
function openSession(){ el("topbar").style.display="none"; el("nav").style.display="none"; sess.classList.remove("hidden"); sess.setAttribute("aria-hidden","false"); }
function closeSession(){ stopAudio(); stopListening(); sess.classList.add("hidden"); sess.setAttribute("aria-hidden","true"); el("topbar").style.display=""; el("nav").style.display=""; render(); }

function buildQueue(items, mode){
  return items.map((it,i)=>{
    let types;
    if (mode==="review") types = canScore() ? ["speak","listen","build"] : ["listen","build","speak"];
    else types = ["speak","speak","build","listen"];
    return { item: byKey(it.key) || it, type: types[i % types.length] };
  });
}
function startLessonSession(les){ touchStreak(); const items=les.items.map((it,i)=>({...it,lid:les.id,idx:i,key:les.id+":"+i})); S={queue:buildQueue(items,"lesson"),i:0,title:les.title,xpGain:0,correct:0}; openSession(); renderExercise(); }
function startReviewSession(items){ touchStreak(); S={queue:buildQueue(items,"review"),i:0,title:"Review",xpGain:0,correct:0}; openSession(); renderExercise(); }
function sProgress(){ requestAnimationFrame(()=>{ const b=el("sbar"); if(b) b.style.width=(S.i/S.queue.length*100)+"%"; }); }
function renderExercise(){ if(S.i>=S.queue.length) return renderSessionFinish(); const ex=S.queue[S.i]; if(ex.type==="speak")renderSpeak(ex); else if(ex.type==="listen")renderListen(ex); else renderBuild(ex); }
function sessionHead(){ return `<div class="s-top"><button class="ghostbtn" id="sClose" aria-label="Close">✕</button><div class="s-prog"><i id="sbar"></i></div><div class="s-count">${S.i+1}/${S.queue.length}</div></div>`; }
function wireClose(){ el("sClose").addEventListener("click", closeSession); }
function spk(slow){ return slow
  ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 10.5a2.5 2.5 0 0 1 0 3"/></svg>`
  : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a9 9 0 0 1 0 14"/></svg>`; }
function renderPhon(p){ return p.replace(/([A-ZĊṄỊỌỤ]{2,})/g, "<b>$1</b>"); }

/* ---------- SPEAK ---------- */
function renderSpeak(ex){
  const it = ex.item;
  const hard = state.hardMode;
  const esWords = it.es.split(" ").map((w,wi)=>`<span class="w" data-w="${wi}">${w}</span>`).join(" ");
  sess.innerHTML = `
    ${sessionHead()}
    <div class="stage">
      <div class="ex-type">Say it</div>
      <div class="prompt-en">${it.en}</div>
      <div class="prompt-es ${hard?'veiled':''}" id="esLine">${esWords}</div>
      ${hard?`<button class="reveal-btn" id="revealBtn">👁 Reveal</button>`:``}
      <div class="phon" id="phonLine" ${hard?'style="visibility:hidden"':''}>${renderPhon(it.phon)}</div>
      <div class="hear-row">
        <button class="hear" id="hearBtn">${spk(0)} Hear it</button>
        <button class="hear slow" id="slowBtn">${spk(1)} Slow</button>
      </div>
      <div class="feedback" id="fb"></div>
      <div class="heard" id="heard"></div>
    </div>
    <div class="s-actions" id="acts"></div>`;
  sProgress(); wireClose();
  el("hearBtn").addEventListener("click", ()=>speak(it.es,1));
  el("slowBtn").addEventListener("click", ()=>speak(it.es,0.6));
  if (hard){ el("revealBtn").addEventListener("click", ()=>{ el("esLine").classList.remove("veiled"); el("phonLine").style.visibility="visible"; el("revealBtn").style.display="none"; }); }
  speakActions("idle", ex);
  setTimeout(()=>speak(it.es, 0.95), 350);
}
function unveil(){ const l=el("esLine"); if(l) l.classList.remove("veiled"); const p=el("phonLine"); if(p) p.style.visibility="visible"; const r=el("revealBtn"); if(r) r.style.display="none"; }
function speakActions(mode, ex){
  const box=el("acts"); const it=ex.item;
  if (mode==="idle"){
    if (canScore()){
      box.innerHTML=`<button class="mic" id="micBtn" aria-label="Tap to speak"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg></button><div class="mic-label">Tap &amp; say it out loud</div>`;
      el("micBtn").addEventListener("click", ()=>startListening(ex));
    } else {
      box.innerHTML=`<div class="mic-label" style="margin-bottom:2px">Say it out loud, then:</div><div class="self-rate"><button class="again" id="rAgain">Try again</button><button class="yes" id="rGot">Got it ✓</button></div>`;
      el("rGot").addEventListener("click", ()=>{ unveil(); const g=record(it.key,true,null); S.xpGain+=g; S.correct++; advance(); });
      el("rAgain").addEventListener("click", ()=>speak(it.es,0.75));
    }
  }
  if (mode==="listening"){
    box.innerHTML=`<button class="mic listening" id="micBtn" aria-label="Listening"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button><div class="mic-label">Listening… tap to stop</div>`;
    el("micBtn").addEventListener("click", stopListening);
  }
  if (mode==="result"){
    box.innerHTML=`<div class="self-rate"><button class="again" id="retry">Retry</button><button class="next accent" id="nextBtn" style="flex:2">${S.i+1>=S.queue.length?"Finish":"Next →"}</button></div>`;
    el("retry").addEventListener("click", ()=>renderSpeak(ex));
    el("nextBtn").addEventListener("click", ()=>advance());
  }
}
let rec=null;
function startListening(ex){
  if (!canScore()) return;
  const it=ex.item;
  try {
    rec=new SR(); rec.lang=L().recLang; rec.interimResults=false; rec.maxAlternatives=3;
    rec.onresult=e=>{ let best=""; for(const alt of e.results[0]) best+=" "+alt.transcript; handleHeard(ex,best.trim()); };
    rec.onerror=e=>{ if(/not-allowed|service-not-allowed|audio-capture/.test(e.error||"")){ micBlocked=true; renderSpeak(ex); return; } speakActions("idle",ex); const fb=el("fb"); if(fb){fb.className="feedback mid"; fb.textContent="Didn't catch that — try again";} };
    S._listening=true; speakActions("listening",ex); rec.start();
  } catch(err){ speakActions("idle",ex); }
}
function stopListening(){ if(S) S._listening=false; if(rec){ try{rec.stop();}catch(e){} } }
function handleHeard(ex, heard){
  const it=ex.item; unveil();
  const {pct,perWord}=scoreSpeech(it.es,heard);
  const ws=document.querySelectorAll("#esLine .w"); perWord.forEach((ok,wi)=>{ if(ws[wi]) ws[wi].className="w "+(ok?"hit":"miss"); });
  const fb=el("fb");
  if(pct>=85){ fb.className="feedback good"; fb.textContent=`¡Perfecto! ${pct}%`; }
  else if(pct>=60){ fb.className="feedback mid"; fb.textContent=`Close — ${pct}%`; }
  else { fb.className="feedback bad"; fb.textContent=`${pct}% — listen again`; }
  el("heard").innerHTML = heard?`heard: <b>“${heard}”</b>`:"";
  const g=record(it.key, pct>=60, pct); S.xpGain+=g; if(pct>=60)S.correct++;
  speakActions("result", ex);
}

/* ---------- LISTEN ---------- */
function renderListen(ex){
  const it=ex.item; const others=POOL.filter(p=>p.en!==it.en); shuffle(others);
  const opts=shuffle([it.en, (others[0]||{}).en||"—", (others[1]||{}).en||"–", (others[2]||{}).en||"·"]);
  sess.innerHTML=`${sessionHead()}<div class="stage"><div class="ex-type">Listen</div><div class="prompt-en">What did you hear?</div><div class="hear-row"><button class="hear" id="hearBtn">${spk(0)} Play</button><button class="hear slow" id="slowBtn">${spk(1)} Slow</button></div><div class="opts" id="opts"></div><div class="feedback" id="fb"></div></div><div class="s-actions" id="acts"></div>`;
  sProgress(); wireClose();
  el("hearBtn").addEventListener("click", ()=>speak(it.es,1));
  el("slowBtn").addEventListener("click", ()=>speak(it.es,0.6));
  const ob=el("opts");
  opts.forEach(o=>{ const b=document.createElement("button"); b.className="opt"; b.textContent=o;
    b.addEventListener("click", ()=>{
      document.querySelectorAll("#opts .opt").forEach(x=>x.disabled=true);
      const right=o===it.en; b.classList.add(right?"correct":"wrong");
      if(!right) document.querySelectorAll("#opts .opt").forEach(x=>{ if(x.textContent===it.en) x.classList.add("correct"); });
      const fb=el("fb"); fb.className="feedback "+(right?"good":"bad"); fb.textContent=right?"¡Correcto!":`It was “${it.es}”`;
      const g=record(it.key,right,right?100:0); S.xpGain+=g; if(right)S.correct++;
      el("acts").innerHTML=`<button class="next accent" id="nextBtn">${S.i+1>=S.queue.length?"Finish":"Next →"}</button>`;
      el("nextBtn").addEventListener("click", ()=>advance());
    }); ob.appendChild(b); });
  setTimeout(()=>speak(it.es,0.95), 350);
}

/* ---------- BUILD ---------- */
function renderBuild(ex){
  const it=ex.item; const target=it.es.split(" "); const bank=shuffle(target.map((w,i)=>({w,i}))); let placed=[];
  sess.innerHTML=`${sessionHead()}<div class="stage"><div class="ex-type">Build it</div><div class="prompt-en">${it.en}</div><div class="phon">${renderPhon(it.phon)}</div><button class="hear" id="hearBtn" style="align-self:center">${spk(0)} Hear it</button><div class="answer-slot" id="slot"></div><div class="bank" id="bank"></div><div class="feedback" id="fb"></div></div><div class="s-actions" id="acts"><button class="next accent" id="checkBtn" disabled>Check</button></div>`;
  sProgress(); wireClose();
  el("hearBtn").addEventListener("click", ()=>speak(it.es,0.9));
  const slot=el("slot"), bankEl=el("bank"), checkBtn=el("checkBtn");
  function drawBank(){ bankEl.innerHTML=""; bank.forEach(tok=>{ const c=document.createElement("button"); c.className="chip"+(tok.used?" used":""); c.textContent=tok.w; c.addEventListener("click", ()=>{ if(tok.used)return; tok.used=true; placed.push(tok); redraw(); }); bankEl.appendChild(c); }); }
  function drawSlot(){ slot.innerHTML=""; slot.className="answer-slot"; placed.forEach((tok,pi)=>{ const c=document.createElement("button"); c.className="chip placed"; c.textContent=tok.w; c.addEventListener("click", ()=>{ tok.used=false; placed.splice(pi,1); redraw(); }); slot.appendChild(c); }); checkBtn.disabled=placed.length!==target.length; }
  function redraw(){ drawBank(); drawSlot(); }
  redraw();
  checkBtn.addEventListener("click", ()=>{
    const attempt=placed.map(t=>t.w).join(" "); const right=norm(attempt)===norm(it.es);
    slot.className="answer-slot "+(right?"ok":"no");
    const fb=el("fb"); fb.className="feedback "+(right?"good":"bad"); fb.textContent=right?"¡Perfecto!":`Correct: “${it.es}”`;
    document.querySelectorAll("#bank .chip").forEach(c=>c.classList.add("used"));
    const g=record(it.key,right,right?100:0); S.xpGain+=g; if(right)S.correct++;
    speak(it.es,0.95);
    el("acts").innerHTML=`<div class="self-rate"><button class="again" id="retry">Retry</button><button class="next accent" id="nextBtn" style="flex:2">${S.i+1>=S.queue.length?"Finish":"Next →"}</button></div>`;
    el("retry").addEventListener("click", ()=>renderBuild(ex)); el("nextBtn").addEventListener("click", ()=>advance());
  });
}
function advance(){ stopAudio(); S.i++; renderExercise(); }
function renderSessionFinish(){
  const total=S.queue.length;
  sess.innerHTML=`<div class="s-top"><button class="ghostbtn" id="sClose">✕</button><div class="s-prog"><i style="width:100%"></i></div><div class="s-count">done</div></div><div class="finish"><div class="big">🎉</div><h2>${state.lang==="ig"?"Ị mere nke ọma!":"¡Bien hecho!"}</h2><div class="score">You got <b>${S.correct}/${total}</b> in ${S.title}</div><div class="xpgain"><svg viewBox="0 0 24 24" fill="currentColor" style="width:18px;height:18px"><path d="M12 2l2.9 6.3 6.9.7-5.1 4.6 1.4 6.8L12 17.8 5.9 20.4l1.4-6.8L2.2 9l6.9-.7z"/></svg> +${S.xpGain} XP</div><button class="next accent" id="againBtn" style="max-width:300px;margin-top:6px">Done</button></div>`;
  el("sClose").addEventListener("click", closeSession); el("againBtn").addEventListener("click", closeSession);
}

/* =============================================================
   CONVERSATION MODE
   ============================================================= */
let C=null;
function startConvo(convo){ touchStreak(); C={convo,i:0,xpGain:0}; openSession(); renderConvoStep(); }
function renderConvoStep(){
  if (C.i>=C.convo.turns.length) return renderConvoFinish();
  const turns=C.convo.turns;
  const bubbles=turns.slice(0,C.i+1).map((t,ti)=>{ const active=ti===C.i;
    return `<div class="bubble ${t.who}"><div class="es">${t.es}</div><div class="en">${t.en}</div>${active?`<div class="ph">${t.phon}</div>`:''}<button class="playmini" data-play="${ti}">${spk(0)} play</button></div>`; }).join("");
  const cur=turns[C.i];
  sess.innerHTML=`<div class="s-top"><button class="ghostbtn" id="sClose">✕</button><div class="s-prog"><i id="cbar"></i></div><div class="s-count">${C.i+1}/${C.convo.turns.length}</div></div><div class="stage" style="justify-content:flex-start;padding-top:8px"><div class="ex-type">${C.convo.emoji} ${C.convo.title}</div><div class="convo">${bubbles}</div>${cur.who==="you"?`<div class="your-turn">👇 Your turn — say it out loud</div>`:``}</div><div class="s-actions" id="acts"></div>`;
  requestAnimationFrame(()=>{ const b=el("cbar"); if(b)b.style.width=(C.i/C.convo.turns.length*100)+"%"; });
  el("sClose").addEventListener("click", closeSession);
  document.querySelectorAll("[data-play]").forEach(b=> b.addEventListener("click", ()=>speak(turns[+b.dataset.play].es,0.95)));
  const acts=el("acts");
  if (cur.who==="them"){ acts.innerHTML=`<button class="next accent" id="nextBtn">Next →</button>`; el("nextBtn").addEventListener("click", convoAdvance); setTimeout(()=>speak(cur.es,0.95),300); }
  else {
    if (canScore()){ acts.innerHTML=`<button class="mic" id="micBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg></button><div class="mic-label">Tap &amp; say your line</div><div class="feedback" id="fb"></div>`; el("micBtn").addEventListener("click", ()=>convoListen(cur)); }
    else { acts.innerHTML=`<div class="self-rate"><button class="again" id="hearIt">Hear it</button><button class="yes" id="saidIt">Said it ✓</button></div>`; el("hearIt").addEventListener("click", ()=>speak(cur.es,0.8)); el("saidIt").addEventListener("click", ()=>{ C.xpGain+=8; convoAdvance(); }); }
  }
}
let crec=null;
function convoListen(cur){
  try {
    crec=new SR(); crec.lang=L().recLang; crec.interimResults=false; crec.maxAlternatives=3;
    el("acts").querySelector(".mic").classList.add("listening");
    crec.onresult=e=>{ let best=""; for(const a of e.results[0]) best+=" "+a.transcript; const {pct}=scoreSpeech(cur.es,best.trim()); const fb=el("fb"); fb.className="feedback "+(pct>=60?"good":"mid"); fb.textContent=pct>=60?`¡Bien! ${pct}%`:`${pct}% — tap to continue`; C.xpGain+=pct>=60?10:4; const nb=document.createElement("button"); nb.className="next accent"; nb.textContent="Next →"; nb.style.marginTop="10px"; nb.addEventListener("click", convoAdvance); el("acts").appendChild(nb); };
    crec.onerror=e=>{ if(/not-allowed|service-not-allowed|audio-capture/.test(e.error||"")){ micBlocked=true; renderConvoStep(); return; } const fb=el("fb"); if(fb){fb.className="feedback mid"; fb.textContent="Didn't catch that — tap Next";} const nb=document.createElement("button"); nb.className="next accent"; nb.textContent="Next →"; nb.style.marginTop="10px"; nb.addEventListener("click",convoAdvance); el("acts").appendChild(nb); };
    crec.start();
  } catch(e){ convoAdvance(); }
}
function convoAdvance(){ stopAudio(); if(crec){try{crec.stop();}catch(e){}} C.i++; renderConvoStep(); }
function renderConvoFinish(){
  state.xp+=C.xpGain; rollDaily(); state.dailyCount+=Math.ceil(C.convo.turns.length/2); saveState();
  sess.innerHTML=`<div class="s-top"><button class="ghostbtn" id="sClose">✕</button><div class="s-prog"><i style="width:100%"></i></div><div class="s-count">done</div></div><div class="finish"><div class="big">💬</div><h2>${state.lang==="ig"?"Mezuru!":"¡Completo!"}</h2><div class="score">You ran through <b>${C.convo.title}</b></div><div class="xpgain"><svg viewBox="0 0 24 24" fill="currentColor" style="width:18px;height:18px"><path d="M12 2l2.9 6.3 6.9.7-5.1 4.6 1.4 6.8L12 17.8 5.9 20.4l1.4-6.8L2.2 9l6.9-.7z"/></svg> +${C.xpGain} XP</div><button class="next accent" id="againBtn" style="max-width:300px;margin-top:6px">Done</button></div>`;
  el("sClose").addEventListener("click", closeSession); el("againBtn").addEventListener("click", closeSession);
}

/* =============================================================
   WIRING
   ============================================================= */
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
document.querySelectorAll(".nav button").forEach(b=> b.addEventListener("click", ()=>{ currentTab=b.dataset.tab; render(); }));
el("langBtn").addEventListener("click", openLangSheet);
(function themeInit(){
  let saved=null; try{ saved=localStorage.getItem("habla.theme"); }catch(e){}
  if (saved) document.documentElement.setAttribute("data-theme", saved);
  el("themeBtn").addEventListener("click", ()=>{ const c=document.documentElement.getAttribute("data-theme"); const dark=c?c==="dark":matchMedia("(prefers-color-scheme: dark)").matches; const next=dark?"light":"dark"; document.documentElement.setAttribute("data-theme",next); try{localStorage.setItem("habla.theme",next);}catch(e){} });
})();

rebuildPool();
render();
</script>
</body>
</html>
